<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/logo.svg">
<title>لوحة العيادة – دورك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F7F6;--surface:#FFFFFF;--surface-2:#F0F4F3;--ink:#10282A;--muted:#58706F;--line:#D6E2DF;
  --brand:#0B6B5E;--on-brand:#FFFFFF;--brand-ink:#0B6B5E;--brand-soft:#D9F0EA;
  --wait-bg:#FFEFCF;--wait-fg:#7A4700;--wait-dot:#E08A00;
  --done-bg:#E2EBE9;--done-fg:#4D6563;
  --bad-bg:#FBE3E0;--bad-fg:#96302B;--off:#8CA3A0;
  --f-d:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-b:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:only light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)} body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.65;margin:0;forced-color-adjust:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-d);text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer} a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* top bar */
.bar{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1300px;margin-inline:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-d);font-weight:700;font-size:20px;color:var(--brand-ink)}
.bar-title{font-family:var(--f-d);font-weight:600;font-size:17px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* doctor tabs */
.dr-tabs{display:flex;gap:6px;overflow-x:auto;padding-block:0 2px;flex:1;min-width:0}
.dr-tab{flex:none;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;
  padding:5px 14px;font-size:13px;font-family:var(--f-d);font-weight:500;white-space:nowrap;cursor:pointer}
.dr-tab[aria-selected="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.dr-tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}

/* page */
.page{max-width:1300px;margin-inline:auto;padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1fr) 300px;gap:22px}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

/* overview grid (all doctors summary) */
.overview-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-bottom:18px}
.ov-card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:border-color .15s}
.ov-card:hover{border-color:var(--brand-ink)}
.ov-card h3{font-size:15px;margin-bottom:6px}
.ov-row{display:flex;gap:16px;flex-wrap:wrap}
.ov-stat b{display:block;font-family:var(--f-d);font-weight:700;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.ov-stat span{font-size:11.5px;color:var(--muted)}
.ov-status{display:flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:2px 8px;font-weight:600}
.ov-status.open{background:var(--brand-soft);color:var(--brand-ink)}
.ov-status.closed{background:var(--bad-bg);color:var(--bad-fg)}
.ov-status i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{font-size:16px;margin-bottom:14px}

/* serving panel */
.serving{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;
  background:var(--brand-soft);border-radius:18px;padding:20px}
@media(max-width:700px){.serving{grid-template-columns:1fr;gap:12px}}
.sv-no .lbl{display:block;font-size:12px;color:var(--brand-ink);font-weight:600}
.sv-no b{display:block;font-family:var(--f-d);font-weight:700;font-size:80px;line-height:1;
  color:var(--brand-ink);font-variant-numeric:tabular-nums}
.sv-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.sv-info h2{font-size:20px;margin-bottom:0}
.sv-info .meta{color:var(--muted);font-size:13.5px}
.meter{height:5px;border-radius:99px;background:var(--surface);overflow:hidden;max-width:280px;margin-top:4px}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.sv-act{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:140px}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:12px 36px;padding-block:12px;border-block:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-d);font-weight:700;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

/* queue */
.qtop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fchip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:6px 12px;
  padding:14px 2px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.rno{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;
  font-family:var(--f-d);font-weight:700;font-size:21px;
  background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.row.in .rno{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.row.waiting .rno{background:var(--wait-bg);color:var(--wait-fg);border-color:transparent}
.row.done .who,.row.noshow .who,.row.cancelled .who{opacity:.7}
.who{min-width:0;display:flex;flex-direction:column;gap:3px}
.who-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.who-top strong{font-family:var(--f-d);font-size:15.5px}
.who-top .meta{color:var(--muted);font-size:13px}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:600px){
  .row{grid-template-columns:50px minmax(0,1fr)}
  .row-side{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.waiting{background:var(--wait-bg);color:var(--wait-fg)}
.pill.in{background:var(--brand-soft);color:var(--brand-ink)}
.pill.done{background:var(--done-bg);color:var(--done-fg)}
.pill.noshow,.pill.cancelled{background:var(--bad-bg);color:var(--bad-fg)}
.flag{display:inline-block;background:var(--wait-bg);color:var(--wait-fg);
  padding:1px 8px;border-radius:6px;font-size:12.5px;font-weight:500}
.tag-staff{display:inline-block;border:1px solid var(--line);border-radius:999px;
  padding:0 7px;font-size:11px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;
  padding:0 16px;border-radius:11px;border:1.5px solid transparent;
  font-family:var(--f-d);font-weight:600;font-size:14px;line-height:1.2}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-bad{background:transparent;border-color:var(--line);color:var(--bad-fg)}
.btn-sm{min-height:34px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%;min-height:46px;font-size:15px}
button:disabled{opacity:.4;cursor:not-allowed}

/* add form */
.addbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.addbox h3{font-size:15px;margin-bottom:12px}
.add-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.add-grid>*{min-width:0}
.span2{grid-column:1 / -1}
label,legend{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;padding:0}
.opt{font-weight:400;color:var(--muted)}
fieldset{border:0;padding:0;margin:0;min-width:0}
input[type=text],input[type=tel],input[type=number],input:not([type]){
  width:100%;min-height:44px;padding:9px 13px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
input::placeholder{color:var(--muted);opacity:.8}
input:focus{outline:none;border-color:var(--brand-ink);box-shadow:0 0 0 3px var(--brand-soft)}
input[dir=ltr]{text-align:right}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.seg label{position:relative;margin:0;font-weight:500}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-height:42px;padding:5px 6px;text-align:center;font-size:13px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2)}
.seg input:checked+span{background:var(--brand-soft);border-color:var(--brand-ink);color:var(--brand-ink);font-weight:600}
.err{color:var(--bad-fg);font-size:12.5px;margin-top:4px}
.err:empty{display:none}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* QR */
.qr-box{background:#fff;border-radius:12px;padding:12px;display:grid;place-items:center;
  margin-block:12px 10px;border:1px solid var(--line)}
.qr-url{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere;margin-top:6px}

/* settings */
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-block:12px;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting h3{font-size:14px}
.setting.col-s{flex-direction:column;align-items:stretch}
.stepper{display:flex;align-items:center;gap:5px}
.stepper button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-2);font-size:18px;line-height:1}
.stepper output{min-width:68px;text-align:center;font-family:var(--f-d);font-weight:600;font-size:13.5px}
.switch{position:relative;flex:none;width:48px;height:28px;border-radius:999px;
  border:0;padding:0;background:var(--off)}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{inset-inline-start:23px}
@media(prefers-reduced-motion:reduce){.switch::after{transition:none}}

/* login */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100svh;gap:16px;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login-box h1{font-size:22px;text-align:center}
.login-box p{color:var(--muted);font-size:13.5px;text-align:center}

/* toast */
.toast{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;justify-content:center;
  pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;
  font-weight:500;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast.show span{opacity:1;transform:none}
/* splash */
.splash{display:flex;align-items:center;justify-content:center;min-height:100svh}
.splash-logo{font-family:var(--f-d);font-weight:700;font-size:40px;color:var(--brand-ink)}
/* footer */
.site-footer{max-width:1300px;margin-inline:auto;text-align:center;padding:8px 16px 24px;
  color:var(--muted);font-size:11.5px;line-height:1.7}
.site-footer a{color:var(--brand-ink);text-decoration:none}
/* manage doctors */
.dr-manage-list{display:flex;flex-direction:column;gap:10px}
.dr-manage-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.dr-manage-row span{flex:1;font-family:var(--f-d);font-size:14px}
.wa-ok{color:#0B6B5E;font-weight:800;margin-inline-start:2px}
.wa-sent{border-color:#0B6B5E}
</style>
</head>
<body>
<div id="app">
  <div class="splash"><div class="splash-logo"><img src="/logo.svg" alt="" style="height:56px;width:56px;vertical-align:middle;margin-inline-end:10px;border-radius:22%">دورك</div></div>
</div>
<footer class="site-footer">
  شكرًا لاستخدامك <strong>دورك</strong> — نتمنى لك تجربة سلسة وموفقة!<br>
  للدعم أو لشراء نسخة مخصصة لعيادتك، تواصل مع المطور:<br>
  <a href="mailto:mbody2233@gmail.com">mbody2233@gmail.com</a><br>
  <span style="font-size:10.5px;opacity:.7">© 2026 Abdulrahman Abed. All rights reserved.</span>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"><span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* ══════════════════════════════════════════════
   CONFIG — استبدل القيم دي بـ config من Firebase
   ══════════════════════════════════════════════ */
var FIREBASE_CONFIG = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL:       "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "000000000000",
  appId:             "1:000000000000:web:0000000000000000000000"
};
var CLIENT_URL = "https://YOUR_PROJECT_ID.web.app/";   /* رابط صفحة العميل */
/* ══════════════════════════════════════════════ */

firebase.initializeApp(FIREBASE_CONFIG);
var db   = firebase.database();
var auth = firebase.auth();

var MIN = 60000;
var APP = document.getElementById('app');

var pad      = function(n){ return n<10?'0'+n:''+n };
var esc      = function(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}) };
var toLatin  = function(s){ return s.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}) };
var tf = new Intl.DateTimeFormat('ar-EG-u-nu-latn',{hour:'numeric',minute:'2-digit'});
var df = new Intl.DateTimeFormat('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
var fmtTime  = function(ms){ return ms ? tf.format(new Date(ms)) : '' };
var fmtPhone = function(p){ return (p||'').length===11?p.slice(0,4)+' '+p.slice(4,7)+' '+p.slice(7):(p||'') };

var TODAY = (function(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()) })();

/* ════════════════════════════════
   STATE
════════════════════════════════ */
var state = {
  /* clinic-level */
  clinicSettings: { name:'العيادة', address:'', phone:'', setupDone:false },
  clinicEditUnlocked: false,
  /* doctors: { drId: { settings, queue (عام), priv (خاص), tickets (المدموج), dailyCode } } */
  doctors: {},
  /* which doctor tab is open */
  activeDr: null,   /* drId or 'overview' */
  /* per-active-doctor UI state */
  drFilter:    'all',
  drAddOpen:   false,
  drEditUnlocked: false,
  drDailyCode: null,
  /* new doctor add form */
  newDrOpen: false
};

/* ── helpers ── */
var STATUS  = {waiting:'منتظر',in:'جوّه الكشف',done:'تم الكشف',noshow:'لم يحضر',cancelled:'لغي الحجز'};
var RANK    = {in:0,waiting:1,done:2,noshow:3,cancelled:3};
var FILTERS = [['all','الكل'],['active','منتظرين وجوّه'],['done','تم'],['out','غياب وإلغاء']];
function matches(t,f){
  if(f==='all')    return true;
  if(f==='active') return t.status==='waiting'||t.status==='in';
  if(f==='done')   return t.status==='done';
  return t.status==='noshow'||t.status==='cancelled';
}
function metaLine(t){
  var p=[];
  if(t.age!==null&&t.age!==undefined&&t.age!=='') p.push(t.age+' سنة');
  if(t.gender) p.push(t.gender);
  p.push(t.type||'');
  return p.join(' · ');
}
function drTickets(drId){
  var d=state.doctors[drId]; if(!d) return [];
  return Object.keys(d.tickets||{})
    .map(function(k){ return Object.assign({},d.tickets[k],{_key:k}) })
    .sort(function(a,b){ return a.no-b.no });
}
function drInside(drId){  return drTickets(drId).find(function(t){ return t.status==='in' }); }
function drWaiting(drId){ return drTickets(drId).filter(function(t){ return t.status==='waiting' }); }
function drAvg(drId){ return (state.doctors[drId] && state.doctors[drId].settings && state.doctors[drId].settings.avg) || 15; }
function drRemaining(drId){
  var c=drInside(drId); if(!c) return 0;
  return Math.max(2, drAvg(drId) - (Date.now()-c.startedAt)/MIN);
}
function waitForTicket(drId,t){
  return drWaiting(drId).filter(function(x){ return x.no<t.no }).length * drAvg(drId) + drRemaining(drId);
}

/* ── toast ── */
var toastT;
function toast(msg){
  var el=document.getElementById('toast');
  el.querySelector('span').textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('show'); },2400);
}

/* رابط واتساب برسالة جاهزة للمريض (من غير أي API، الستاف بيدوس ويبعت) */
function waLink(drId,t){
  var p=String(t.phone||'').replace(/\D/g,'');
  if(!p) return '';
  if(p.charAt(0)==='0') p='20'+p.slice(1);
  var ahead=drWaiting(drId).filter(function(x){ return x.no<t.no }).length + (drInside(drId)?1:0);
  var first=(t.first||String(t.name||'').split(' ')[0]);
  var dn=(state.doctors[drId]&&state.doctors[drId].settings&&state.doctors[drId].settings.name)||'';
  var msg='أهلاً '+first+'، دورك'+(dn?' عند '+dn:'')+' في '+state.clinicSettings.name+' قرب. رقمك '+t.no
    +(ahead>0?' وفاضل '+ahead+' قبلك':'')+'. من فضلك اتفضل على العيادة.';
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(msg);
}

/* ── Firebase paths ── */
function drBase(drId){ return 'clinics/doctors/'+drId; }
function drTicketPath(drId){ return drBase(drId)+'/days/'+TODAY+'/queue'; }     /* الطابور العام */
function drPrivPath(drId){ return drBase(drId)+'/days/'+TODAY+'/private'; }     /* بيانات المرضى (للستاف بس) */
function drDayPath(drId){ return drBase(drId)+'/days/'+TODAY; }
function rebuildDr(drId){
  var d=state.doctors[drId]; if(!d) return;
  var m={};
  Object.keys(d.queue||{}).forEach(function(k){ m[k]=Object.assign({}, (d.priv||{})[k]||{}, d.queue[k]); });
  d.tickets=m;
}
/* الدليل العام للدكاترة اللي بيشوفه المرضى (الاسم والتخصص وحالة الحجز بس) */
function syncDirectory(drId){
  var d=state.doctors[drId]; if(!d||!d.settings) return;
  var v={ name:d.settings.name||drId, specialty:d.settings.specialty||'', avg:d.settings.avg||15, open:d.settings.open!==false };
  var sig=JSON.stringify(v); if(d._dirSig===sig) return; d._dirSig=sig;
  db.ref('clinics/directory/'+drId).set(v);
}
function drCounterPath(drId){ return drBase(drId)+'/days/'+TODAY+'/counter'; }
/* كود واحد للعيادة كلها (لكل الدكاترة) */
function dayCodeBase(){ return 'clinics/dayCode/'+TODAY; }
function drCodePath(drId){ return dayCodeBase()+'/code'; }

/* ── Firebase ops ── */
function setStatus(drId, key, status, extra){
  var up=Object.assign({status:status},extra||{});
  db.ref(drTicketPath(drId)+'/'+key).update(up);
}
var callingNext={};
function callNext(drId){
  if(callingNext[drId]) return;
  callingNext[drId]=true;
  setTimeout(function(){ callingNext[drId]=false; },800);
  var cur=drInside(drId), w=drWaiting(drId);
  var now=Date.now();
  if(cur){
    setStatus(drId,cur._key,'done',{doneAt:now});
    if(state.doctors[drId]&&state.doctors[drId].tickets[cur._key])
      Object.assign(state.doctors[drId].tickets[cur._key],{status:'done',doneAt:now});
  }
  if(w[0]){
    setStatus(drId,w[0]._key,'in',{startedAt:now});
    if(state.doctors[drId]&&state.doctors[drId].tickets[w[0]._key])
      Object.assign(state.doctors[drId].tickets[w[0]._key],{status:'in',startedAt:now});
    toast('الدور الجاي: '+w[0].no+' · '+w[0].name);
  }
  render();
}
function saveDrSettings(drId){
  var s=state.doctors[drId].settings;
  return db.ref(drBase(drId)+'/settings').update({
    name: s.name, specialty: s.specialty,
    address: s.address, hours: s.hours, phone: s.phone,
    avg: s.avg, open: s.open, setupDone: true
  });
}
function saveClinicSettings(){
  return db.ref('clinics/settings').update({
    name:      state.clinicSettings.name,
    address:   state.clinicSettings.address,
    phone:     state.clinicSettings.phone,
    setupDone: true
  });
}
/* لو مفيش كود لليوم للعيادة، بنولّده أوتوماتيك أول ما الستاف يفتح الصفحة (من غير كود الحجز مقفول على المرضى) */
function ensureDailyCode(drId){
  var code=String(Math.floor(1000+Math.random()*9000));
  db.ref(drCodePath(drId)).transaction(function(c){ return c || code; })
    .then(function(){ return db.ref(dayCodeBase()+'/codeOn').set(true); }).catch(function(){});
}
function genDailyCode(drId){
  var code=String(Math.floor(1000+Math.random()*9000));
  db.ref(dayCodeBase()).update({ code:code, codeOn:true });
}
function addDoctor(drId, name){
  /* create doctor node with defaults */
  return db.ref(drBase(drId)+'/settings').set({
    name: name, specialty:'', address:'', hours:'', phone:'', avg:15, open:true, setupDone:false
  });
}

  }
  html += '<div class="setting">'
    +'<div><h3>استقبال الحجز</h3><p class="muted small" id="open-label">'+(s.open?'مفتوح':'متوقف')+'</p></div>'
    +'<button class="switch" role="switch" id="sw-open" aria-checked="'+!!s.open+'" aria-label="استقبال الحجز"></button>'
    +'</div>';
  if(!locked){
    html += '<div style="padding-top:12px;border-top:1px solid var(--line)">'
      +'<button class="btn btn-primary btn-block" id="btn-dr-save">حفظ الإعدادات</button></div>';
  }
  html += '</section>';

  html += '</div></div></main>'; /* .col .grid .page */
  APP.innerHTML = html;
  bindDoctor();
}

/* ── bind: overview ── */
function bindOverview(){
  var btnLogout=document.getElementById('btn-logout');
  if(btnLogout) btnLogout.onclick=function(){ auth.signOut(); };

  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick=function(){ state.activeDr=b.dataset.tab; state.drFilter='all'; state.drAddOpen=false; state.drEditUnlocked=false; render(); };
  });
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.onclick=function(){ state.activeDr=b.dataset.go; state.drFilter='all'; state.drAddOpen=false; state.drEditUnlocked=false; render(); };
  });

  var btnClinicUnlock=document.getElementById('btn-clinic-unlock');
  if(btnClinicUnlock) btnClinicUnlock.onclick=function(){
    if(confirm('متأكد إنك عايز تعدّل إعدادات العيادة؟')){ state.clinicEditUnlocked=true; render(); }
  };
  var btnClinicSave=document.getElementById('btn-clinic-save');
  if(btnClinicSave) btnClinicSave.onclick=function(){
    state.clinicSettings.name    = document.getElementById('cs-name').value.trim() || state.clinicSettings.name;
    state.clinicSettings.address = document.getElementById('cs-address').value.trim();
    state.clinicSettings.phone   = toLatin(document.getElementById('cs-phone').value).replace(/[\s-]/g,'');
    var saved=JSON.parse(JSON.stringify(state.clinicSettings));
    state.clinicSettings.setupDone=true; state.clinicEditUnlocked=false;
    render(); toast('تم حفظ إعدادات العيادة');
    saveClinicSettings().catch(function(err){
      state.clinicSettings=saved; state.clinicEditUnlocked=true; render();
      toast('خطأ في الحفظ');
    });
  };

  var btnShowAddDr=document.getElementById('btn-show-add-dr');
  if(btnShowAddDr) btnShowAddDr.onclick=function(){ state.newDrOpen=!state.newDrOpen; render(); };
  var btnFirstAddDr=document.getElementById('btn-first-add-dr');
  if(btnFirstAddDr) btnFirstAddDr.onclick=function(){ state.newDrOpen=true; render(); };
  var btnAddDrCancel=document.getElementById('btn-add-dr-cancel');
  if(btnAddDrCancel) btnAddDrCancel.onclick=function(){ state.newDrOpen=false; render(); };
  var btnAddDrSubmit=document.getElementById('btn-add-dr-submit');
  if(btnAddDrSubmit) btnAddDrSubmit.onclick=function(){
    var id  =document.getElementById('nd-id').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
    var name=document.getElementById('nd-name').value.trim();
    var errs={};
    if(id.length<2)   errs.id='اكتب معرّف صالح (حروف إنجليزية على الأقل).';
    if(state.doctors[id]) errs.id='المعرّف ده موجود بالفعل.';
    if(name.length<2) errs.name='اكتب اسم الدكتور.';
    document.getElementById('nd-id-err').textContent=errs.id||'';
    document.getElementById('nd-name-err').textContent=errs.name||'';
    if(Object.keys(errs).length) return;
    addDoctor(id,name).then(function(){
      state.newDrOpen=false;
      toast('تمت إضافة '+name);
    }).catch(function(){ toast('خطأ في الإضافة، جرّب تاني'); });
  };
}

/* ── bind: doctor view ── */
function bindDoctor(){
  var btnLogout=document.getElementById('btn-logout');
  if(btnLogout) btnLogout.onclick=function(){ auth.signOut(); };

  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick=function(){ state.activeDr=b.dataset.tab; state.drFilter='all'; state.drAddOpen=false; state.drEditUnlocked=false; render(); };
  });

  var btnNext=document.getElementById('btn-next');
  if(btnNext) btnNext.onclick=function(){ callNext(state.activeDr); };

  document.querySelectorAll('[data-filter]').forEach(function(b){
    b.onclick=function(){ state.drFilter=b.dataset.filter; render(); };
  });
  /* واتساب: أول ما الستاف يدوس نحط علامة ✓ (محفوظة عند الستاف في Firebase، فتفضل بعد التحديث) */
  document.querySelectorAll('[data-wa]').forEach(function(a){
    a.addEventListener('click', function(){
      var drId=state.activeDr, key=a.dataset.wa, now=Date.now();
      db.ref(drPrivPath(drId)+'/'+key+'/waAt').set(now);
      var d=state.doctors[drId];
      if(d && d.priv && d.priv[key]) d.priv[key].waAt=now;
      rebuildDr(drId);
      setTimeout(render,150);   /* بعد ما المتصفح يفتح واتساب، عشان الـre-render ما يلغيش الفتح */
    });
  });

  document.querySelectorAll('[data-act]').forEach(function(b){
    b.onclick=function(){
      if(b.disabled) return;
      var key=b.dataset.key, a=b.dataset.act;
      var drId=state.activeDr;
      if(a==='call'){
        setStatus(drId,key,'in',{startedAt:Date.now()});
        /* optimistic local update */
        if(state.doctors[drId]&&state.doctors[drId].tickets[key])
          Object.assign(state.doctors[drId].tickets[key],{status:'in',startedAt:Date.now()});
      }
      if(a==='finish'){
        setStatus(drId,key,'done',{doneAt:Date.now()});
        if(state.doctors[drId]&&state.doctors[drId].tickets[key])
          Object.assign(state.doctors[drId].tickets[key],{status:'done',doneAt:Date.now()});
      }
      if(a==='noshow'){
        setStatus(drId,key,'noshow');
        if(state.doctors[drId]&&state.doctors[drId].tickets[key])
          state.doctors[drId].tickets[key].status='noshow';
      }
      if(a==='requeue'){
        setStatus(drId,key,'waiting',{startedAt:null,doneAt:null});
        if(state.doctors[drId]&&state.doctors[drId].tickets[key])
          Object.assign(state.doctors[drId].tickets[key],{status:'waiting',startedAt:null,doneAt:null});
      }
      render();
    };
  });

  var btnToggleAdd=document.getElementById('btn-toggle-add');
  if(btnToggleAdd) btnToggleAdd.onclick=function(){
    state.drAddOpen=!state.drAddOpen; render();
    if(state.drAddOpen) setTimeout(function(){ var el=document.getElementById('a-name'); if(el) el.focus(); },0);
  };
  var btnAddCancel=document.getElementById('btn-add-cancel');
  if(btnAddCancel) btnAddCancel.onclick=function(){ state.drAddOpen=false; render(); };
  var addForm=document.getElementById('add-form');
  if(addForm) addForm.addEventListener('submit', submitAdd);

  /* avg stepper */
  var avgInc=document.getElementById('avg-inc');
  var avgDec=document.getElementById('avg-dec');
  if(avgInc) avgInc.onclick=function(){
    state.doctors[state.activeDr].settings.avg=Math.min(60,(state.doctors[state.activeDr].settings.avg||15)+1);
    document.getElementById('avg-out').textContent=state.doctors[state.activeDr].settings.avg+' دقيقة';
  };
  if(avgDec) avgDec.onclick=function(){
    state.doctors[state.activeDr].settings.avg=Math.max(3,(state.doctors[state.activeDr].settings.avg||15)-1);
    document.getElementById('avg-out').textContent=state.doctors[state.activeDr].settings.avg+' دقيقة';
  };

  /* open/close */
  var swOpen=document.getElementById('sw-open');
  if(swOpen) swOpen.onclick=function(){
    var drId=state.activeDr;
    var oldVal=state.doctors[drId].settings.open;
    var newVal=!oldVal;
    state.doctors[drId].settings.open=newVal;
    swOpen.setAttribute('aria-checked',String(newVal));
    var lbl=document.getElementById('open-label');
    if(lbl) lbl.textContent=newVal?'مفتوح':'متوقف';
    db.ref(drBase(drId)+'/settings/open').set(newVal).catch(function(){
      /* rollback on error */
      state.doctors[drId].settings.open=oldVal;
      toast('خطأ في تغيير الحالة');
      render();
    });
  };

  var btnDrSave=document.getElementById('btn-dr-save');
  if(btnDrSave) btnDrSave.onclick=function(){
    var drId=state.activeDr;
    var s=state.doctors[drId].settings;
    s.name      = document.getElementById('ds-name').value.trim()    || s.name;
    s.specialty = document.getElementById('ds-spec').value.trim();
    s.address   = document.getElementById('ds-address').value.trim();
    s.hours     = document.getElementById('ds-hours').value.trim();
    s.phone     = toLatin(document.getElementById('ds-phone').value).replace(/[\s-]/g,'');
    var saved=JSON.parse(JSON.stringify(state.doctors[drId].settings));
    s.setupDone=true; state.drEditUnlocked=false;
    render(); toast('تم حفظ الإعدادات');
    saveDrSettings(drId).catch(function(){
      state.doctors[drId].settings=saved; state.drEditUnlocked=true; render();
      toast('خطأ في الحفظ');
    });
  };
  var btnDrUnlock=document.getElementById('btn-dr-unlock');
  if(btnDrUnlock) btnDrUnlock.onclick=function(){
    if(confirm('متأكد إنك عايز تعدّل إعدادات الدكتور؟')){ state.drEditUnlocked=true; render(); }
  };

  var btnNewCode=document.getElementById('btn-new-code');
  if(btnNewCode) btnNewCode.onclick=function(){ genDailyCode(state.activeDr); };
  var btnDisplay=document.getElementById('btn-open-display');
  if(btnDisplay) btnDisplay.onclick=function(){ window.open('../../display/?dr='+encodeURIComponent(state.activeDr),'_blank'); };
}

function submitAdd(e){
  e.preventDefault();
  var drId=state.activeDr;
  var form=e.currentTarget;
  var name  =document.getElementById('a-name').value.trim().replace(/\s+/g,' ');
  var phone =toLatin(document.getElementById('a-phone').value||'').replace(/[\s-]/g,'');
  var ageRaw=toLatin(document.getElementById('a-age').value||'').trim();
  var age   =ageRaw===''?null:parseInt(ageRaw,10);
  var g     =form.querySelector('input[name=agender]:checked');
  var type  =form.querySelector('input[name=atype]:checked').value;
  var errs={};
  if(name.length<2) errs.name='اكتب اسم المريض.';
  if(!/^01[0125]\d{8}$/.test(phone)) errs.phone=phone?'رقم الموبايل مش صح.':'اكتب رقم الموبايل.';
  else {
    var dup=drTickets(drId).find(function(t){return t.phone===phone&&(t.status==='waiting'||t.status==='in')});
    if(dup) errs.phone='الرقم عنده حجز شغال برقم '+dup.no+'.';
  }
  if(age===null||isNaN(age)) errs.age='اكتب السن.';
  else if(!(age>=0&&age<=120)) errs.age='السن لازم يكون بين 0 و120.';
  ['name','phone','age'].forEach(function(k){var el=document.getElementById('ae-'+k);if(el)el.textContent=errs[k]||'';});
  if(Object.keys(errs).length){ document.getElementById('a-'+Object.keys(errs)[0]).focus(); return; }
  if(!g){ toast('اختار النوع (ذكر / أنثى)'); return; }
  var submitBtn=form.querySelector('button[type=submit]');
  if(submitBtn) submitBtn.disabled=true;
  db.ref(drCounterPath(drId)).transaction(function(c){ return (c||0)+1; }).then(function(result){
    var no=result.snapshot.val();
    var id=db.ref(drTicketPath(drId)).push().key;
    var up={};
    up['private/'+id]={
      name:name, phone:phone||'', age:age, gender:g?g.value:'',
      type:type, why:document.getElementById('a-why').value.trim(),
      chronic:document.getElementById('a-chronic').value.trim(), src:'staff'
    };
    up['queue/'+id]={ no:no, first:name.split(' ')[0].slice(0,30), status:'waiting', createdAt:Date.now() };
    db.ref(drDayPath(drId)).update(up);
    form.reset(); toast('اتضاف '+name+' برقم '+no);
    if(submitBtn) submitBtn.disabled=false;
  }).catch(function(){
    if(submitBtn) submitBtn.disabled=false;
    toast('حصل خطأ، جرّب تاني');
  });
}

function drawQR(url){
  var box=document.getElementById('qr-container'); if(!box) return;
  try{
    box.innerHTML='';
    new QRCode(box,{text:url,width:172,height:172,colorDark:'#10282A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  }catch(err){ box.innerHTML='<p class="muted small">تعذّر رسم الكود</p>'; }
}

/* ════════════════════════════════
   LISTENERS
════════════════════════════════ */
function startListeners(){
  /* clinic settings */
  db.ref('clinics/settings').on('value',function(snap){
    var v=snap.val()||{};
    state.clinicSettings.name     = v.name     || 'العيادة';
    state.clinicSettings.address  = v.address  || '';
    state.clinicSettings.phone    = v.phone    || '';
    state.clinicSettings.setupDone= !!v.setupDone;
    render();
  });

  /* doctors list — لما يتضاف دكتور جديد بيلاقيه ويشتغل عليه */
  db.ref('clinics/doctors').on('child_added', function(snap){
    var drId=snap.key;
    if(state.doctors[drId]) return; /* already there */
    state.doctors[drId]={ settings:{}, queue:{}, priv:{}, tickets:{}, dailyCode:null };

    /* settings */
    db.ref(drBase(drId)+'/settings').on('value',function(s2){
      var v=s2.val()||{};
      state.doctors[drId].settings=Object.assign({
        name:drId,specialty:'',address:'',hours:'',phone:'',avg:15,open:true,setupDone:false
      }, v);
      /* sync daily code to main state if this is active doctor */
      if(state.activeDr===drId) state.drDailyCode=state.doctors[drId].dailyCode;
      syncDirectory(drId);   /* بيحدّث الدليل العام اللي المرضى بيشوفوه */
      render();
    });
    /* tickets */
    db.ref(drTicketPath(drId)).on('value',function(s3){
      state.doctors[drId].queue=s3.val()||{};
      rebuildDr(drId); render();
    });
    db.ref(drPrivPath(drId)).on('value',function(s5){
      state.doctors[drId].priv=s5.val()||{};
      rebuildDr(drId); render();
    });
    /* daily code */
    db.ref(drCodePath(drId)).on('value',function(s4){
      state.doctors[drId].dailyCode=s4.val()||null;
      if(!s4.exists()) ensureDailyCode(drId);
      if(state.activeDr===drId) state.drDailyCode=state.doctors[drId].dailyCode;
      render();
    });
  });
}

/* ── sync drDailyCode when tab changes ── */
var _lastActiveDr=null;
var _origRender=render;
render=function(){
  if(state.activeDr && state.activeDr!=='overview' && state.activeDr!==_lastActiveDr){
    /* tab actually changed: reset per-doctor UI state */
    _lastActiveDr=state.activeDr;
    state.drFilter='all';
    state.drAddOpen=false;
    state.drEditUnlocked=false;
    if(state.doctors[state.activeDr]){
      state.drDailyCode=state.doctors[state.activeDr].dailyCode||null;
    }
  } else if(state.activeDr && state.activeDr!=='overview' && state.doctors[state.activeDr]){
    /* same tab, just sync dailyCode in case it arrived from Firebase */
    state.drDailyCode=state.doctors[state.activeDr].dailyCode||null;
  }
  _origRender();
};

/* ── auth ── */
function showLogin(){
  APP.innerHTML='<div class="login-wrap"><div class="login-box">'
    +'<div style="text-align:center;font-family:var(--f-d);font-weight:700;font-size:36px;color:var(--brand-ink);margin-bottom:8px">دورك</div>'
    +'<h1>لوحة العيادة</h1>'
    +'<p>سجّل دخولك بالإيميل والباسورد اللي حددتهم في Firebase.</p>'
    +'<div><label for="l-email">الإيميل</label>'
    +'<input id="l-email" type="email" inputmode="email" dir="ltr" autocomplete="email"></div>'
    +'<div><label for="l-pass">الباسورد</label>'
    +'<input id="l-pass" type="password" dir="ltr" autocomplete="current-password"></div>'
    +'<p class="err" id="l-err" role="alert"></p>'
    +'<button class="btn btn-primary btn-block" id="btn-login">دخول</button>'
    +'</div></div>';
  document.getElementById('btn-login').onclick=function(){
    var email=document.getElementById('l-email').value.trim();
    var pass =document.getElementById('l-pass').value;
    document.getElementById('l-err').textContent='';
    auth.signInWithEmailAndPassword(email,pass).catch(function(){
      document.getElementById('l-err').textContent='الإيميل أو الباسورد مش صح.';
    });
  };
  document.getElementById('l-pass').addEventListener('keydown',function(e){
    if(e.key==='Enter') document.getElementById('btn-login').click();
  });
}

auth.setPersistence(firebase.auth.Auth.Persistence.NONE).then(function(){
  return auth.signOut();
}).then(function(){
  auth.onAuthStateChanged(function(user){
    if(user){ startListeners(); }
    else     { showLogin();     }
  });
});
