<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/logo.svg">
<title>شاشة العرض – دورك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F7F6;--surface:#FFFFFF;--surface-2:#F0F4F3;--ink:#10282A;--muted:#58706F;--line:#D6E2DF;
  --brand:#0B6B5E;--on-brand:#FFFFFF;--brand-ink:#0B6B5E;--brand-soft:#D9F0EA;
  --wait-bg:#FFEFCF;--wait-fg:#7A4700;
  --f-d:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-b:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:only light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-b);margin:0;height:100%;forced-color-adjust:none;overflow:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-d);line-height:1.2}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--muted)}

/* start overlay */
.start{position:fixed;inset:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;z-index:50;text-align:center;padding:24px}
.start .logo{font-family:var(--f-d);font-weight:700;font-size:56px;color:#fff}
.start button{background:var(--brand);color:#fff;border:0;border-radius:16px;padding:20px 48px;
  font-family:var(--f-d);font-weight:700;font-size:22px}
.start p{opacity:.75;font-size:15px;max-width:480px}

/* layout */
.stage{height:100svh;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 440px;gap:0}
@media(max-width:860px){.stage{grid-template-columns:1fr}}
.clinic-bar{grid-column:1/3;border-bottom:2px solid var(--line);display:flex;align-items:center;
  justify-content:center;padding:18px 32px;background:var(--surface)}
.clinic-bar h1{font-family:var(--f-d);font-weight:700;font-size:28px;color:var(--brand-ink);margin:0;
  text-align:center}
.main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;min-width:0}
.serving-label{font-size:18px;color:var(--muted);font-weight:600}
.serving-no{font-family:var(--f-d);font-weight:700;font-size:min(28vw,280px);line-height:1;
  color:var(--brand-ink);font-variant-numeric:tabular-nums}
.serving-no.empty{color:var(--muted);font-size:min(20vw,180px)}

/* side panel */
.side{grid-row:2;background:var(--surface);border-inline-start:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px}
.side h2{font-size:18px;color:var(--ink)}
.qr-box{background:#fff;border-radius:20px;padding:18px;border:1px solid var(--line)}
.code-label{font-size:14px;color:var(--muted);letter-spacing:1px}
.code-no{font-family:var(--f-d);font-weight:700;font-size:80px;letter-spacing:8px;color:var(--brand-ink);
  font-variant-numeric:tabular-nums;line-height:1}
.day-code{margin-top:14px;text-align:center}.day-code span{display:block;font-size:15px;color:var(--muted)}.day-code b{display:block;font-size:56px;letter-spacing:8px;color:var(--brand-ink);font-family:var(--f-d)}
.side .hint{font-size:13px;color:var(--muted);text-align:center;max-width:280px}

/* flash on change */
@keyframes flash{0%{background:var(--brand-soft)}100%{background:transparent}}
.flash{animation:flash 1.4s ease-out}
#sound-badge{position:fixed;bottom:14px;inset-inline-start:14px;background:rgba(16,40,42,.88);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:60}
</style>
</head>

var audioUnlocked = false;
var badge = document.getElementById('sound-badge');
function playChime(){
  /* بنحاول نشغّل الصوت دايمًا؛ لو المتصفح مسموحله هيشتغل، ولو لأ بيتفعّل بأول لمسة */
  try{
    var a = new Audio(CHIME_SRC);
    a.volume = 1;
    var p = a.play(); if(p && p.catch) p.catch(function(){ badge.hidden = false; });
  }catch(e){}
}
function markUnlocked(){
  audioUnlocked = true; badge.hidden = true;
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ document.removeEventListener(ev, onGesture, true); });
}
function tryUnlock(){
  /* تشغيل صامت للتأكد إن الصوت مسموح (بيشتغل من أول فتح لو المتصفح مسموح) */
  try{
    var u = new Audio(CHIME_SRC); u.volume = 0.001;
    var p = u.play();
    if(p && p.then) p.then(function(){ u.pause(); markUnlocked(); }).catch(function(){ badge.hidden = false; });
    else markUnlocked();
  }catch(e){ badge.hidden = false; }
}
var fsDone = false;
function onGesture(){
  tryUnlock();
  if(!fsDone && document.documentElement.requestFullscreen){ fsDone = true; document.documentElement.requestFullscreen().catch(function(){}); }
}
['pointerdown','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, onGesture, true); });
tryUnlock();

function ticketArr(){
  return Object.keys(state.tickets).map(function(k){ return Object.assign({},state.tickets[k],{_key:k}) })
    .sort(function(a,b){ return a.no-b.no });
}
function inside(){ return ticketArr().find(function(t){ return t.status==='in' }) }
function waiting(){ return ticketArr().filter(function(t){ return t.status==='waiting' }) }

function render(){
  var cur = inside(), w = waiting();
  var newNo = cur ? cur.no : null;
  var justChanged = false;
  if(qReady){
    justChanged = (lastServingNo !== undefined) && newNo !== lastServingNo && newNo !== null;
    lastServingNo = newNo;
  }

  var html = '<div class="clinic-bar"><h1>'+esc(state.clinic.name||'العيادة')+'</h1></div>';
  html += '<div class="main' + (justChanged?' flash':'') + '">';
  html += '<div class="serving-label">الدور الحالي</div>';
  html += cur
    ? '<div class="serving-no">'+cur.no+'</div>'
    : '<div class="serving-no empty">-</div>';
  html += '</div>';

  html += '<div class="side">'
    +'<h2>احجز دورك</h2>'
    +'<div class="qr-box" id="qr-container"></div>'
    +(state.code?'<div class="day-code"><span>كود اليوم</span><b dir="ltr">'+esc(state.code)+'</b></div>':'')
    +'</div>';

  STAGE.innerHTML = html;
  drawQR();

  if(justChanged) playChime();
}

function drawQR(){
  var box = document.getElementById('qr-container'); if(!box) return;
  try{
    box.innerHTML = '';
    new QRCode(box, { text: CLIENT_URL, width: 280, height: 280, colorDark:'#10282A', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
  }catch(e){ box.innerHTML = '<p class="muted">تعذّر رسم الكود</p>'; }
}

function startListeners(){
  db.ref('clinics/main/settings').on('value', function(snap){
    var v = snap.val()||{};
    state.clinic.name = v.name || 'العيادة';
    render();
  });
  db.ref('clinics/main/days/'+TODAY+'/code').on('value', function(snap){ state.code = snap.val()||''; render(); });
  db.ref('clinics/main/days/'+TODAY+'/queue').on('value', function(snap){
    state.tickets = snap.val() || {};
    if(!qReady){ qReady = true; var c0 = inside(); lastServingNo = c0 ? c0.no : null; }   /* أول تحميل: نسجّل الدور الحالي من غير صوت */
    render();
  });
}
startListeners();
</script>
